name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify shared partials are in sync
        # Fails if any page's shared chrome drifted from partials/ (run `python build.py` to fix).
        run: python build.py --check

      - name: Run link checker
        run: python scripts/check_links.py
