  <!-- ── AI Chat Widget ── -->
  <div class="chat-widget" id="chatWidget">
    <div class="chat-nudge" id="chatNudge">Ask me anything! ✦</div>
    <button class="chat-toggle" id="chatToggle" aria-label="Chat with Panos AI">
      <svg class="chat-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <svg class="chat-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span class="chat-badge">AI</span>
    </button>
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <div class="chat-header-info">
          <picture>
            <source srcset="/photo.webp" type="image/webp" />
            <img src="/photo.jpg" alt="Panos Kokmotos" class="chat-avatar" />
          </picture>
          <div class="chat-header-text">
            <strong>Ask Panos</strong>
            <span><span class="chat-status-dot"></span>AI · Usually replies instantly</span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="chat-new-btn" id="chatNewChat" title="New conversation" aria-label="Start new conversation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="15" height="15"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="chat-size-btn" id="chatSizeToggle" title="Make button bigger" aria-label="Toggle AI button size" aria-pressed="false">
            <svg class="size-icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            <svg class="size-icon-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" style="display:none"><path d="M4 14h6v6M14 4h6v6M10 14l-7 7M21 3l-7 7"/></svg>
          </button>
          <button class="chat-close-btn" id="chatClose" aria-label="Close chat">✕</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot">
          <p>👋 Hi! I'm Panos's AI assistant. Ask me anything about his work, Givelink, the podcast, or how to get in touch!</p>
        </div>
      </div>
      <div class="chat-starters" id="chatStarters">
        <p class="chat-starters-label">Ask me anything</p>
        <button class="chat-starter-chip" onclick="useChatStarter(this)">
          <span class="csc-icon">🚀</span>
          <span class="csc-text">How does Givelink work?</span>
          <svg class="csc-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
        <button class="chat-starter-chip" onclick="useChatStarter(this)">
          <span class="csc-icon">🤝</span>
          <span class="csc-text">Can I partner or invest?</span>
          <svg class="csc-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
        <button class="chat-starter-chip" onclick="useChatStarter(this)">
          <span class="csc-icon">🎙️</span>
          <span class="csc-text">Tell me about the podcast</span>
          <svg class="csc-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
        <button class="chat-starter-chip" onclick="useChatStarter(this)">
          <span class="csc-icon">📅</span>
          <span class="csc-text">How can I book a call?</span>
          <svg class="csc-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
      </div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Ask about Givelink, my journey, speaking…" autocomplete="off" />
        <button id="chatMic" aria-label="Voice input" title="Speak your question" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="chatSend" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="chat-note">Powered by <a href="https://anthropic.com" target="_blank" rel="noopener">Claude AI</a></p>
    </div>
  </div>
